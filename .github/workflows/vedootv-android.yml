name: VedooTV Android validation

on:
  push:
    branches:
      - branding/vedootv
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vedootv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Generate branding and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply uploaded Canva branding overlay
        run: |
          unzip -o "vedootv_canva_branding_overlay (2).zip" -d .
          rm "vedootv_canva_branding_overlay (2).zip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install branding export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 -m venv .venv-branding
          .venv-branding/bin/python -m pip install --upgrade Pillow numpy

      - name: Prepare permanent VedooTV release signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_PASSWORD repository secret first."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            # First run only: create the permanent key and export ciphertext only.
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/vedootv-release.jks" \
              -storetype JKS -alias vedootv -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=VedooTV, OU=Android, O=VedooTV, C=MA" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEYSTORE_PASSWORD
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
              -in "$RUNNER_TEMP/vedootv-release.jks" \
              -out "$RUNNER_TEMP/vedootv-keystore.enc" \
              -pass env:ANDROID_KEYSTORE_PASSWORD
            base64 -w0 "$RUNNER_TEMP/vedootv-keystore.enc" \
              > "$RUNNER_TEMP/vedootv-keystore.enc.b64.txt"
            echo "BOOTSTRAP_KEY=true" >> "$GITHUB_ENV"
          else
            # Later runs: decrypt the saved ciphertext into the temporary runner.
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d \
              > "$RUNNER_TEMP/vedootv-keystore.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in "$RUNNER_TEMP/vedootv-keystore.enc" \
              -out "$RUNNER_TEMP/vedootv-release.jks" \
              -pass env:ANDROID_KEYSTORE_PASSWORD
            cp "$RUNNER_TEMP/vedootv-release.jks" android/app/vedootv-release.jks
            cat > android/key.properties <<EOF
          storeFile=vedootv-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=vedootv
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
            chmod 600 android/key.properties android/app/vedootv-release.jks
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Upload encrypted signing-key backup (first run only)
        if: env.BOOTSTRAP_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vedootv-encrypted-signing-key
          path: ${{ runner.temp }}/vedootv-keystore.enc.b64.txt
          if-no-files-found: error
          retention-days: 7

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate VedooTV raster branding
        run: |
          .venv-branding/bin/python assets/branding/export.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build optimized Huawei ARM64 release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        # Huawei P20 Lite uses 64-bit ARM. Building only this ABI avoids
        # bundling native libraries for unrelated x86 / 32-bit devices.
        # Keep resource shrinking disabled in build.gradle.kts: it previously
        # removed dynamically referenced icons and caused startup to hang.
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vedootv-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized ARM64 release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vedootv-android-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
# Signed release build trigger after permanent signing-key setup.
