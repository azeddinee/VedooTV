name: VedooTV Android validation

on:
  push:
    branches:
      - branding/vedootv
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vedootv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Generate branding and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install branding export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox
          python3 -m venv .venv-branding
          .venv-branding/bin/python -m pip install --upgrade Pillow numpy

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate VedooTV raster branding
        run: |
          .venv-branding/bin/python assets/branding/export.py
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vedootv-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
